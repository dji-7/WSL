name: Validate diagnostics

on:
  push:
    paths:
      - 'diagnostics/**'
      - '.github/workflows/batchfile.yml'
  pull_request:
    paths:
      - 'diagnostics/**'
      - '.github/workflows/batchfile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check Bash syntax
        run: bash -n diagnostics/networking.sh

      - name: Check XML well-formedness
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          for path in (
              "diagnostics/wsl.wprp",
              "diagnostics/wsl_networking.wprp",
          ):
              ET.parse(path)
              print(f"Valid XML: {path}")
          PY

      - name: Check Batch script exists
        run: test -s diagnostics/networking.bat
